backend:
  name: github
  repo: kac0pi/kac0pi
  branch: main
  base_url: https://helpful-muffin-8f1c7b.netlify.app
  auth_endpoint: auth

site_url: https://kac0pi.github.io/kac0pi
display_url: https://kac0pi.github.io/kac0pi

media_folder: "assets/uploads"
public_folder: "/kac0pi/assets/uploads"

publish_mode: editorial_workflow
locale: "pl"

collections:
  - name: "blog"
    label: "Artykuły"
    label_singular: "Artykuł"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Tytuł", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Opis", name: "description", widget: "text" }
      - { label: "Tagi", name: "tags", widget: "list", default: ["webdev"] }
      - { label: "Kategoria", name: "category", widget: "string", default: "IT" }
      - { label: "Treść", name: "body", widget: "markdown" }
